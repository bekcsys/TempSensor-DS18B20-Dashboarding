services:
  postgres:
    image: postgres:16-alpine
    container_name: tempsensor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sauna_tests}
      POSTGRES_USER: ${POSTGRES_USER:-sauna_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sauna_user} -d ${POSTGRES_DB:-sauna_tests}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
