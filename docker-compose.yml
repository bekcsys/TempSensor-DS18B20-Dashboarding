services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tempsensor-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./stack/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 2 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mqtt-publisher:
    build:
      context: .
      dockerfile: docker/mqtt-publisher.Dockerfile
    container_name: tempsensor-mqtt-publisher
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      TZ: ${TZ:-America/Chicago}
      TEST_UNIT: ${TEST_UNIT}
      SERIAL_NUMBER: ${SERIAL_NUMBER}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - /sys/bus/w1/devices:/sys/bus/w1/devices:ro
      - ./exports:/app/exports

volumes:
  mosquitto_data:
  mosquitto_log:
